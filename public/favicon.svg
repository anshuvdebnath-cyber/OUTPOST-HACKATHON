<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Grantly logo">
  <style>
    .bg-stop-1 { stop-color: #0f294a; }
    .bg-stop-2 { stop-color: #184b82; }
    .bg-stop-3 { stop-color: #3b82c4; }
    .reed-tint { stop-color: #bae6fd; }
    .center-tint { stop-color: #93c5fd; }
    @media (prefers-color-scheme: dark) {
      .bg-stop-1 { stop-color: #04241c; }
      .bg-stop-2 { stop-color: #0b5c46; }
      .bg-stop-3 { stop-color: #22a077; }
      .reed-tint { stop-color: #a7f3d0; }
      .center-tint { stop-color: #6ee7b7; }
    }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" class="bg-stop-1"/>
      <stop offset="52%" class="bg-stop-2"/>
      <stop offset="100%" class="bg-stop-3"/>
    </linearGradient>
    <linearGradient id="reed1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.98"/>
      <stop offset="100%" class="reed-tint" stop-opacity="0.78"/>
    </linearGradient>
    <linearGradient id="reed2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef3c7" stop-opacity="1"/>
      <stop offset="52%" stop-color="#ffffff" stop-opacity="0.96"/>
      <stop offset="100%" class="center-tint" stop-opacity="0.86"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="18" fill="url(#bg)"/>
  <rect x="2" y="2" width="60" height="60" rx="16" fill="none" stroke="#ffffff" stroke-opacity="0.4" stroke-width="1.5"/>
  <!-- Three ascending fluted glass pillars -->
  <rect x="12" y="29" width="9" height="23" rx="4.5" fill="url(#reed1)"/>
  <rect x="27.5" y="21" width="9" height="31" rx="4.5" fill="url(#reed2)"/>
  <rect x="43" y="14" width="9" height="38" rx="4.5" fill="url(#reed1)"/>
  <!-- Crystalline 4-point scholarship star spark -->
  <path d="M16.5 10.5 L18.3 15.2 L23 17 L18.3 18.8 L16.5 23.5 L14.7 18.8 L10 17 L14.7 15.2 Z" fill="#fde68a"/>
</svg>
