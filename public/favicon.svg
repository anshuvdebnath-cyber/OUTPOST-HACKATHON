<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Grantly logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b2838"/>
      <stop offset="52%" stop-color="#0d5c46"/>
      <stop offset="100%" stop-color="#38b28b"/>
    </linearGradient>
    <linearGradient id="reed1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#a7f3d0" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="reed2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde68a" stop-opacity="0.98"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#6ee7b7" stop-opacity="0.8"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="18" fill="url(#bg)"/>
  <rect x="2" y="2" width="60" height="60" rx="16" fill="none" stroke="#ffffff" stroke-opacity="0.32" stroke-width="1.5"/>
  <!-- Three ascending fluted glass reeds forming the Grantly prism crest -->
  <rect x="14" y="26" width="9" height="24" rx="4.5" fill="url(#reed1)"/>
  <rect x="27.5" y="18" width="9" height="32" rx="4.5" fill="url(#reed2)"/>
  <rect x="41" y="12" width="9" height="38" rx="4.5" fill="url(#reed1)"/>
  <circle cx="18.5" cy="18" r="3.5" fill="#fde68a"/>
</svg>
